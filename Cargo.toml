[package]
name = "ntiv"
version = "0.5.0"
edition = "2024"
description = "A keyboard-first file navigator for Windows"
license = "MIT"
repository = "https://github.com/Fresh600/NTIV"
homepage = "https://github.com/Fresh600/NTIV"
readme = "README.md"
keywords = ["file-manager", "terminal", "tui", "windows", "vim"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
dunce = "1.0"
ignore = "0.4"
imagesize = "0.15"
ratatui = "0.30"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5.2"
unicode-bidi = "0.3"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
